name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS: the pipeline targets bash 3.2 and BSD userland; the scheduler
    # tests exercise launchd plist rendering (dry-run only).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install query server deps
        run: cd packages/query/server && npm ci
      - name: Run every suite + oss-guard
        run: bash scripts/test-all.sh

  oss-guard-linux:
    # The guard itself must stay portable so it can run anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .claude/scripts/oss-guard.sh
